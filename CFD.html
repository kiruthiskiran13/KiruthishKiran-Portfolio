<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CFD Velocity Streamlines</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      line-height: 1.5;
      color: #222;
    }
    h2 {
      margin-top: 24px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 4px;
    }
    .img-row {
      margin-top: 16px;
      display: flex;
      gap: 20px;
    }
    .img-row img {
      width: 100%;
      height: auto;
      border: 1px solid #ddd;
    }
    .half {
      flex: 1;
    }
  </style>
</head>
<body>

  <h2>Velocity Streamline – 321.9 km/h</h2>
  <img src="imgCFD1.png" alt="Velocity streamline at 321.9 km/h" />

  <h2>Velocity Streamlines – 92 km/h</h2>
  <div class="img-row">
    <div class="half">
      <img src="imgCFD2.png" alt="Velocity streamline at 92 km/h - Image 2" />
    </div>
    <div class="half">
      <img src="imgCFD3.png" alt="Velocity streamline at 92 km/h - Image 3" />
    </div>
  </div>

</body>
</html>
